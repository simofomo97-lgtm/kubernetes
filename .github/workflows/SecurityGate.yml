name: SBOM Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          artifact-name: sbom-cyclonedx.json

  upload:
    needs: sbom
    runs-on: self-hosted

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx.json
          path: .

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          protocol: "http"
          serverHostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          port: "8081"
          apiKey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          project: '9d5ae6e5-5d61-47b7-9470-048ed16d2168'
          bomFilename: "sbom-cyclonedx.json"
 
      security-gate:
    needs: upload
    runs-on: self-hosted

    steps:
      - name: Check Policy Violations (cmd + PowerShell)
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -Command ^
            "$ProjectUuid = '9d5ae6e5-5d61-47b7-9470-048ed16d2168'; ^
             $DtHost = 'localhost'; ^
             $DtPort = '8081'; ^
             $ApiKey = 'odt_tf0hF7jq_ezIqKJcFQecbL4WfS9DDKMl8dgQLU4w0'; ^
             Write-Host 'Recuperation des metriques du projet...'; ^
             $headers = @{ 'X-Api-Key' = $ApiKey; 'accept' = 'application/json' }; ^
             $metricsUrl = \"http://$DtHost`:$DtPort/api/v1/metrics/project/$ProjectUuid/current\"; ^
             Write-Host \"URL metriques: $metricsUrl\"; ^
             try { $metrics = Invoke-RestMethod -Method GET -Uri $metricsUrl -Headers $headers } ^
             catch { Write-Error \"Impossible de recuperer les metriques: $_\"; exit 1 }; ^
             $policyTotal = $metrics.policyViolationsTotal; ^
             $policyFail  = $metrics.policyViolationsFail; ^
             $policyWarn  = $metrics.policyViolationsWarn; ^
             $policyInfo  = $metrics.policyViolationsInfo; ^
             $critical = $metrics.critical; ^
             $high     = $metrics.high; ^
             $medium   = $metrics.medium; ^
             $low      = $metrics.low; ^
             Write-Host \"Violations: total=$policyTotal, fail=$policyFail, warn=$policyWarn, info=$policyInfo\"; ^
             Write-Host \"Vulns: critical=$critical, high=$high, medium=$medium, low=$low\"; ^
             $maxPolicyFail   = 0; ^
             $maxCriticalVuln = 0; ^
             $maxHighVuln     = 5; ^
             $failBuild = $false; ^
             if ($policyFail -gt $maxPolicyFail) { Write-Host \"ECHEC: $policyFail violations FAIL\"; $failBuild = $true }; ^
             if ($critical -gt $maxCriticalVuln) { Write-Host \"ECHEC: $critical vuln crit\"; $failBuild = $true }; ^
             if ($high -gt $maxHighVuln) { Write-Host \"AVERTISSEMENT: $high vuln hautes\"; $failBuild = $true }; ^
             if ($failBuild) { Write-Host 'BUILD BLOQUE'; exit 1 } else { Write-Host 'Build OK' }"
