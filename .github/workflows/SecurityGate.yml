name: SBOM Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          artifact-name: sbom-cyclonedx.json

  upload:
    needs: sbom
    runs-on: self-hosted

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx.json
          path: .

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          protocol: "http"
          serverHostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          port: "8081"
          apiKey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          project: '9d5ae6e5-5d61-47b7-9470-048ed16d2168'
          bomFilename: "sbom-cyclonedx.json"

  security-gate:
    needs: upload
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Policy Violations
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\check_policy.ps1" `
            -ProjectUuid '9d5ae6e5-5d61-47b7-9470-048ed16d2168' `
            -DtHost 'localhost' `
            -DtPort '8081' `
            -ApiKey 'odt_tf0hF7jq_ezIqKJcFQecbL4WfS9DDKMl8dgQLU4w0'
